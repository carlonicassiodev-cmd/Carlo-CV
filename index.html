<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carlo Nicassio</title>
<meta name="description" content="Carlo Nicassio — Ingegneria Informatica e dell'Automazione al Politecnico di Bari. CTF, sicurezza informatica, sviluppo software, sistemi Linux." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

<style>
  :root{
    --bg: #0a0b0f;
    --bg-2: #101218;
    --glass: rgba(255,255,255,0.045);
    --glass-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.09);
    --text: #f4f5f8;
    --text-muted: #949aad;
    --violet: #8b7bff;
    --teal: #34e2c0;
    --font-display: 'Bricolage Grotesque', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }
  a{ color:inherit; }
  ::selection{ background: var(--violet); color:#0a0b0f; }
  .wrap{ max-width: 1080px; margin:0 auto; padding:0 28px; position:relative; z-index:2; }

  /* ---------- TOP BAR ---------- */
  nav{
    position:sticky; top:0; z-index:80;
    background: rgba(10,11,15,0.7);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner{ max-width:1080px; margin:0 auto; padding:16px 28px; display:flex; justify-content:space-between; align-items:center; }
  .nav-logo{ font-family: var(--font-display); font-weight:700; font-size:1.02rem; letter-spacing:-0.01em; }
  .social-row{ display:flex; gap:10px; }
  .social-btn{
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); background: var(--glass);
    color: var(--text-muted); text-decoration:none;
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .social-btn:hover{ color: var(--text); border-color: var(--violet); background: var(--glass-hover); transform: translateY(-2px); }
  .social-btn svg{ width:17px; height:17px; }

  /* ---------- HERO / PARTE 1 ---------- */
  header.hero{ position:relative; padding: 110px 0 90px; overflow:hidden; }
  .glow{
    position:absolute; z-index:0; border-radius:50%;
    filter: blur(90px); pointer-events:none;
  }
  .glow-a{ width:520px; height:520px; top:-220px; right:-140px; background: radial-gradient(circle, rgba(139,123,255,0.35), transparent 70%); }
  .glow-b{ width:420px; height:420px; bottom:-200px; left:-140px; background: radial-gradient(circle, rgba(52,226,192,0.22), transparent 70%); }

  .spotlight{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(320px circle at var(--mx,50%) var(--my,20%), rgba(139,123,255,0.10), transparent 70%);
  }

  .eyebrow{
    font-family: var(--font-mono); font-size:0.74rem; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--teal); display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background: var(--violet); box-shadow: 0 0 12px var(--violet); }

  .hero h1{
    font-family: var(--font-display); font-weight:800; letter-spacing:-0.02em;
    font-size: clamp(2.8rem, 7vw, 5rem); line-height:1.0; margin:0 0 6px;
  }
  .hero h1 .grad{ background: linear-gradient(100deg, var(--violet), var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero .role{ font-family: var(--font-mono); color: var(--text-muted); font-size:0.92rem; margin: 6px 0 34px; }

  .lede-block{ max-width: 66ch; }
  .lede-block p{ font-size:1.08rem; line-height:1.75; color: var(--text-muted); margin: 0 0 22px; }
  .lede-block p strong{ color: var(--text); font-weight:600; }
  .lede-block p.signal-note{ font-size:0.96rem; font-style:italic; color: rgba(148,154,173,0.85); border-left: 2px solid var(--border); padding-left:16px; margin-top:30px; }

  .tag-row{ display:flex; flex-wrap:wrap; gap:9px; margin: 14px 0 26px; }
  .tag{
    font-family: var(--font-mono); font-size:0.76rem; padding:7px 14px; border-radius:999px;
    border:1px solid var(--border); background: var(--glass); color: var(--text-muted);
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .tag:hover{ color: var(--text); border-color: var(--violet); transform: translateY(-2px); }
  .tag.focus{ color: var(--teal); border-color: rgba(52,226,192,0.35); background: rgba(52,226,192,0.06); }
  .tag.focus:hover{ border-color: var(--teal); }

  .block-label{ font-family: var(--font-mono); font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; color: var(--text); margin: 30px 0 4px; display:block; }
  .block-label:first-of-type{ margin-top:0; }

  /* ---------- SECTIONS ---------- */
  section{ padding: 90px 0; border-top: 1px solid var(--border); position:relative; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom: 46px; }
  section h2{ font-family: var(--font-display); font-weight:700; font-size: clamp(1.8rem, 3.6vw, 2.5rem); margin:0; letter-spacing:-0.01em; }
  .section-index{ font-family: var(--font-mono); font-size:0.78rem; color: var(--text-muted); }

  .reveal{ opacity:0; transform: translateY(28px); transition: opacity 0.7s cubic-bezier(.2,.7,.2,1), transform 0.7s cubic-bezier(.2,.7,.2,1); }
  .reveal.visible{ opacity:1; transform:none; }

  /* ---------- PERCORSO / PARTE 2 ---------- */
  .timeline{ position:relative; padding-left: 36px; }
  .timeline::before{ content:''; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background: linear-gradient(var(--violet), var(--teal)); opacity:0.5; }
  .t-item{ position:relative; padding-bottom: 46px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-item::before{ content:''; position:absolute; left:-36px; top:4px; width:14px; height:14px; border-radius:50%; background: var(--bg); border:2px solid var(--violet); }
  .t-item.future::before{ border-color: var(--teal); border-style:dashed; }
  .t-item .t-date{ font-family: var(--font-mono); font-size:0.82rem; color: var(--violet); }
  .t-item.future .t-date{ color: var(--teal); }
  .t-item h3{ font-family: var(--font-display); font-weight:700; font-size:1.28rem; margin: 6px 0 10px; }
  .t-item p.desc{ color: var(--text-muted); line-height:1.7; max-width: 62ch; margin: 0 0 14px; }
  .notion-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .notion{ font-family: var(--font-mono); font-size:0.72rem; padding:5px 12px; border-radius:999px; border:1px solid var(--border); color: var(--text-muted); background: var(--glass); }

  /* ---------- PROGETTI / PARTE 3 ---------- */
  .proj-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  @media (max-width:720px){ .proj-grid{ grid-template-columns:1fr; } }
  .proj-card{
    position:relative;
    background: var(--glass); border:1px solid var(--border); border-radius:20px;
    padding: 30px; transition: border-color 0.25s ease, background 0.25s ease;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .proj-card:hover{ border-color: rgba(139,123,255,0.4); background: var(--glass-hover); }
  .proj-card .proj-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .proj-card h3{ font-family: var(--font-display); font-weight:700; font-size:1.16rem; margin:0; }
  .proj-card .arrow{ font-family: var(--font-mono); color: var(--text-muted); transition: transform 0.2s ease, color 0.2s ease; }
  .proj-card:hover .arrow{ transform: translate(3px,-3px); color: var(--teal); }
  .proj-card p{ color: var(--text-muted); font-size:0.94rem; line-height:1.65; margin: 0 0 18px; }
  .proj-stack{ display:flex; flex-wrap:wrap; gap:7px; }
  .proj-stack span{ font-family: var(--font-mono); font-size:0.68rem; color: var(--teal); padding:4px 10px; border-radius:999px; background: rgba(52,226,192,0.08); border:1px solid rgba(52,226,192,0.2); }
  .proj-card a.card-link{ position:absolute; inset:0; border-radius:20px; }

  .proj-more{ margin-top: 30px; text-align:center; }
  .btn-outline{
    font-family: var(--font-mono); font-size:0.84rem; padding:14px 26px; border-radius:12px;
    border:1px solid var(--border); text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    transition: border-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
  }
  .btn-outline:hover{ border-color: var(--violet); color: var(--violet); transform: translateY(-2px); }

  /* ---------- FOOTER ---------- */
  footer{ padding: 40px 0 56px; text-align:center; color: var(--text-muted); font-family: var(--font-mono); font-size:0.78rem; border-top: 1px solid var(--border); }
  footer .grad{ background: linear-gradient(100deg, var(--violet), var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useRef, useState } = React;

const BIRTH_DATE = new Date(2005, 11, 14); // 14 dicembre 2005
function computeAge(){
  const now = new Date();
  let age = now.getFullYear() - BIRTH_DATE.getFullYear();
  const hasHadBirthday = (now.getMonth() > BIRTH_DATE.getMonth()) ||
    (now.getMonth() === BIRTH_DATE.getMonth() && now.getDate() >= BIRTH_DATE.getDate());
  if(!hasHadBirthday) age--;
  return age;
}

const SOCIALS = [
  { key:"mail", label:"Email", href:"mailto:carlo.nicassio.dev@gmail.com",
    icon: <path d="M3 6.5 12 13l9-6.5M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/> },
  { key:"linkedin", label:"LinkedIn", href:"https://www.linkedin.com/in/carlo-nicassio-8157883a7/",
    icon: <React.Fragment><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" strokeWidth="1.6"/><path d="M7.5 10v6.2M7.5 7.6v.02M12 16.2v-3.6c0-1.4 1-2.4 2.2-2.4 1.2 0 1.9.9 1.9 2.4v3.6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/></React.Fragment> },
  { key:"github", label:"GitHub", href:"https://github.com/carlonicassiodev-cmd",
    icon: <path d="M12 2a10 10 0 0 0-3.16 19.5c.5.1.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.15-1.11-1.46-1.11-1.46-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.66.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.68 0 3.84-2.35 4.68-4.58 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/> },
  { key:"instagram", label:"Instagram", href:"https://instagram.com/carlo_nicassio",
    icon: <React.Fragment><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" strokeWidth="1.6"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" strokeWidth="1.6"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/></React.Fragment> },
];

function useReveal(){
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.15 });
    el.querySelectorAll('.reveal').forEach(n => obs.observe(n));
    return () => obs.disconnect();
  }, []);
  return ref;
}

function Nav(){
  return (
    <nav>
      <div className="nav-inner">
        <div className="nav-logo">CN</div>
        <div className="social-row">
          {SOCIALS.map(s => (
            <a key={s.key} className="social-btn" href={s.href} target="_blank" rel="noreferrer" aria-label={s.label}>
              <svg viewBox="0 0 24 24">{s.icon}</svg>
            </a>
          ))}
        </div>
      </div>
    </nav>
  );
}

function Hero(){
  const heroRef = useRef(null);
  const onMove = (e) => {
    const r = heroRef.current.getBoundingClientRect();
    heroRef.current.style.setProperty('--mx', `${e.clientX - r.left}px`);
    heroRef.current.style.setProperty('--my', `${e.clientY - r.top}px`);
  };
  return (
    <header className="hero" id="top" ref={heroRef} onMouseMove={onMove}>
      <div className="glow glow-a"></div>
      <div className="glow glow-b"></div>
      <div className="spotlight"></div>
      <div className="wrap">
        <div className="eyebrow">Computer Engineer — Bari</div>
        <h1>Carlo <span className="grad">Nicassio</span></h1>
        <p className="role">Ingegnere Informatico, appassionato di ingegneria , segnali e informatica.</p>
        <div className="tag-row" style={{marginTop:'-16px', marginBottom:'34px'}}>
          <span className="tag">Bari, 14 dicembre 2005</span>
        </div>

        <div className="lede-block">
          <span className="block-label">Cosa ho studiato</span>
          <p>
            Il mio percorso in <strong>Ingegneria Informatica e dell'Automazione</strong> al
            Politecnico di Bari mi ha dato basi solide di <strong>problem solving,
            matematica, elettronica, robotica, fisica, informatica e
            programmazione</strong> — gli strumenti per capire e progettare
            sistemi complessi, prima ancora che per scrivere codice.
            Successivamente ho approfondito tematiche legate a <strong>Telecomunicazioni , Sicurezza Informatica,
            Sviluppo software , cloud e project managment</strong> attraverso la <strong>laurea magistrale</strong> e approfondimenti personali .
          </p>
          <div className="tag-row">
            {["Problem solving","Matematica","Elettronica","Robotica","Fisica","Informatica","Programmazione"].map(t => (
              <span className="tag" key={t}>{t}</span>
            ))}
          </div>

          <span className="block-label">Di cosa mi occupo</span>
          <p>
            In particolare mi concentro su <strong>telecomunicazioni , sicurezza informatica ,
            sviluppo software e cloud</strong>: è lì che porto
            avanti progetti personali e approfondimenti continui, tra CTF,
            scripting e development.
          </p>
          <div className="tag-row">
            {["CTF","Sicurezza informatica","Software dev","Linux","Automazione"].map(t => (
              <span className="tag focus" key={t}>{t}</span>
            ))}
          </div>

          <p className="signal-note">
            Un filo conduttore attraversa questi interessi: i segnali. Li ho
            approfonditi anche grazie alla musica e al lavoro come tecnico del
            suono, dove filtri ed equalizzatori raccontano, in un altro
            linguaggio, la stessa logica che ritrovo nel codice.
          </p>
        </div>
      </div>
    </header>
  );
}

function Percorso(){
  const ref = useReveal();
  const items = [
    {
      title: "Liceo Scientifico, opzione Scienze Applicate",
      desc: "Diploma con votazione 90. Distinzione per le doti informatiche alle Olimpiadi di Informatica.",
      notions: ["Basi di matematica e fisica", "Primi linguaggi di programmazione", "Metodo scientifico"],
      future: false,
    },
    {
      title: "Laurea Triennale — Ingegneria Informatica e dell'Automazione, Poliba",
      desc: "Percorso al Politecnico di Bari, affiancato da progetti personali di automazione , embedded systems (arduino & esp32) , sviluppo software e CTF.",
      notions: ["Programmazione", "Sistemi operativi", "Reti", "Elettronica", "Automazione e controlli", "Algoritmi e strutture dati", "Analisi matematica"],
      future: false,
    },
    {
  
      title: "Laurea Magistrale — Ingegneria delle Telecomunicazioni",
      desc: "Approfondimento su reti e sicurezza informatica, con uno sguardo alla progettazione di sistemi su larga scala.",
      notions: ["Reti avanzate", "Sicurezza informatica", "Sviluppo di codice sicuro", "Reti cloud e architetture complesse"],
      future: true,
    },
  ];
  return (
    <section id="percorso" ref={ref}>
      <div className="wrap reveal">
        <div className="section-head">
          <h2>Percorso accademico</h2>
          <span className="section-index">2019 → oggi</span>
        </div>
        <div className="timeline">
          {items.map((it,i) => (
            <div className={`t-item ${it.future ? "future" : ""}`} key={i}>
              <div className="t-date">{it.date}</div>
              <h3>{it.title}</h3>
              <p className="desc">{it.desc}</p>
              <div className="notion-row">
                {it.notions.map(n => <span className="notion" key={n}>{n}</span>)}
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function ProjectCard({ p }){
  const cardRef = useRef(null);
  const onMove = (e) => {
    const el = cardRef.current;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(700px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translateY(-3px)`;
  };
  const onLeave = () => { cardRef.current.style.transform = ""; };
  return (
    <div className="proj-card" ref={cardRef} onMouseMove={onMove} onMouseLeave={onLeave}>
      <div className="proj-top">
        <h3>{p.title}</h3>
        <span className="arrow">↗</span>
      </div>
      <p>{p.desc}</p>
      <div className="proj-stack">{p.stack.map(s => <span key={s}>{s}</span>)}</div>
      <a className="card-link" href={p.href} target="_blank" rel="noreferrer" aria-label={p.title}></a>
    </div>
  );
}

function Progetti(){
  const ref = useReveal();
  const projects = [
    { title:"Controlli automatici (PID controllers) in JAVA — automazione", desc:"Breve descrizione:simulazione di sistemi di controllo automatico.", stack:["Java","Intellij" , "Controlli Automatici"], href:"#" },
    { title:"Allenamenti e Sfide CFT — HTB", desc:" Toolkit e competenze sviluppate durante CTF.", stack:["Sicurezza","HTB"], href:"#" },
    { title:"Progetti esp32 — robotica", desc:"Progetto personale di robotica e automazione hardware.", stack:["MicroPython","Elettronica"], href:"#" },
    { title:"Analisi predittiva attraverso misurazioni in laboratorio — ingegneria", desc:"Progetto legato all'esame di misure,svolto in laboratorio e approfondito.", stack:["Reti","Cloud"], href:"#" },
  ];
  return (
    <section id="progetti" ref={ref}>
      <div className="wrap reveal">
        <div className="section-head">
          <h2>Progetti</h2>
          <span className="section-index">Dal 2020</span>
        </div>
        <div className="proj-grid">
          {projects.map((p,i) => <ProjectCard p={p} key={i} />)}
        </div>
        <div className="proj-more">
          <a className="btn-outline" href="https://github.com/carlonicassiodev-cmd" target="_blank" rel="noreferrer">Tutti i progetti su GitHub ↗</a>
        </div>
      </div>
    </section>
  );
}

function Footer(){
  return <footer><div className="wrap">Progettato e sviluppato da <span className="grad">Carlo Nicassio</span> — © {new Date().getFullYear()}</div></footer>;
}

function App(){
  return (
    <React.Fragment>
      <Nav /><Hero /><Percorso /><Progetti /><Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
